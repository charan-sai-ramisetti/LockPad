- name: Update apt cache
  apt:
    update_cache: yes

- name: Install requirements for Docker
  apt:
    name:
      - curl
      - gnupg
      - lsb-release
      - ca-certificates
    state: present

- name: Add Docker GPG apt Key
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Force apt cache update
  apt:
    update_cache: yes

- name: Install Docker and requirements
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - python3-docker
    state: present

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: Install base packages
  apt:
    name:
      - git
      - curl
      - python3
      - python3-pip
      - python3-venv
      - gnupg
      - apt-transport-https
      - debian-keyring
      - debian-archive-keyring
    state: present

- name: Install unzip
  apt:
    name: unzip
    state: present

- name: Install AWS CLI via official script
  shell: |
    curl -fsSL https://awscli.amazonaws.com/v2/install.sh -o install.sh
    bash install.sh
  args:
    creates: /usr/local/bin/aws
