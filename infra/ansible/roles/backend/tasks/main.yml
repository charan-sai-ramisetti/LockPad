- name: Create directory for app
  file:
    path: "{{ app_dir }}"
    state: directory

- name: Clone application repo
  git:
    repo: https://github.com/charan-sai-ramisetti/LockPad.git
    dest: "{{ app_dir }}"
    force: yes

- name: Create .env file for docker-compose
  copy:
    dest: "{{ app_dir }}/.env"
    content: |
      ECR_REGISTRY={{ lookup('env','ECR_REGISTRY') }}
      DJANGO_SECRET_KEY={{ lookup('env','DJANGO_SECRET_KEY') }}
      LOCKPAD_FERNET_KEY={{ lookup('env','LOCKPAD_FERNET_KEY') }}

- name: Copy docker-compose.yml
  copy:
    src: ../../../../docker-compose.yml
    dest: "{{ app_dir }}/docker-compose.yml"

- name: Login to ECR
  shell: aws ecr get-login-password --region {{ lookup('env','AWS_REGION') }} | docker login --username AWS --password-stdin {{ lookup('env','ECR_REGISTRY') }}

- name: Start docker containers
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    pull: always


